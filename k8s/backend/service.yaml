apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ewsp
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ewsp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ewsp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
