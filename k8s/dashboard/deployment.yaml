apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: ewsp
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ewsp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/part-of: ewsp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ewsp
    spec:
      containers:
        - name: dashboard
          image: ewsp-dashboard:replace-with-ewsp-local-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
