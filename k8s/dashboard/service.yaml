apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ewsp
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ewsp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: ewsp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
