apiVersion: v1
kind: Secret
metadata:
  name: ewsp-infrastructure-secrets
  namespace: ewsp
  labels:
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: ewsp
type: Opaque
stringData:
  POSTGRES_USER: replace-with-postgres-user
  POSTGRES_PASSWORD: replace-with-postgres-password
  MINIO_ROOT_USER: replace-with-minio-root-user
  MINIO_ROOT_PASSWORD: replace-with-minio-root-password
  JWT_SECRET: replace-with-jwt-secret
  EWSP_MAIL_ENABLED: "true"
  EWSP_MAIL_HOST: smtp.example.com
  EWSP_MAIL_PORT: "587"
  EWSP_MAIL_USERNAME: replace-with-smtp-username
  EWSP_MAIL_PASSWORD: replace-with-smtp-password
  EWSP_MAIL_FROM: replace-with-approved-sender-address
  EWSP_MAIL_SMTP_AUTH: "true"
  EWSP_MAIL_STARTTLS_ENABLE: "true"
